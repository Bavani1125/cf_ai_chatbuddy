<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cloudflare AI ChatBuddy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

 
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🤖 Cloudflare AI ChatBuddy</h1>
    <p>Your smart AI assistant powered by Cloudflare Workers ✨</p>

    <label for="system-prompt">System Prompt (optional):</label>
    <textarea id="system-prompt" placeholder="You are a concise, helpful assistant."></textarea>

    <div id="chat-box"></div>

    <div class="row">
      <input type="text" id="user-input" placeholder="Type a message...">
      <button id="send">Send</button>
    </div>
  </div>


  <script>
    const sessionId = crypto.randomUUID();

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const sp = document.getElementById('system-prompt');
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, 'user');
      input.value = '';

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId,
          userMessage: text,
          systemPrompt: sp.value
        })
      });

      const data = await res.json();
      addBubble(data.reply || '(no reply)', 'bot');
    }

    function addBubble(text, who) {
      const div = document.createElement('div');
      div.className = 'bubble ' + (who === 'user' ? 'user' : 'bot');
      div.textContent = text;
      document.getElementById('chat-box').appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }

    document.getElementById('send').onclick = sendMessage;
    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
